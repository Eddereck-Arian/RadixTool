<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Chart</title>
<style>
:root{--bg:#F5F6F4;--grid:rgba(20,33,61,.06);--surface:#fff;--s2:#EEF0EB;--ink:#14213D;--soft:#57607a;--faint:#8891a6;--line:#DBDFD5;--accent:#C8102E;--gold:#9C6B0C;--goldbg:#FBF0DA;--green:#2E7D32;--ink-on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1620;--grid:rgba(231,236,242,.055);--surface:#16212C;--s2:#1C2A37;--ink:#E9EEF4;--soft:#A7B4C6;--faint:#71809A;--line:#2A3B4C;--accent:#FF4D63;--gold:#F2BB4E;--goldbg:#2B2313;--green:#6FCF75;--ink-on:#3A0510}}
:root[data-theme="dark"]{--bg:#0E1620;--grid:rgba(231,236,242,.055);--surface:#16212C;--s2:#1C2A37;--ink:#E9EEF4;--soft:#A7B4C6;--faint:#71809A;--line:#2A3B4C;--accent:#FF4D63;--gold:#F2BB4E;--goldbg:#2B2313;--green:#6FCF75;--ink-on:#3A0510}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:40px 18px 70px;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.page{max-width:720px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
h1{font:700 2.3rem Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:-.01em}
h1 small{font:500 .8rem ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:7px;margin-left:8px;vertical-align:middle}
.sub{margin:4px 0 0;color:var(--soft);font-size:.92rem}
.tog{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.05rem;flex-shrink:0}
.tabs{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px 12px 0 0;overflow:hidden}
.tab{flex:1;padding:14px 8px;border:0;background:none;color:var(--faint);font:600 .88rem inherit;font-family:inherit;cursor:pointer;position:relative}
.tab[aria-selected=true]{color:var(--ink);background:var(--surface)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--accent);border-radius:3px 3px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:24px 20px 28px;box-shadow:0 16px 40px -22px rgba(20,33,61,.4)}
.lead{margin:0 0 4px;color:var(--soft);font-size:.9rem}
.entry{font:.8rem ui-monospace,Menlo,Consolas,monospace;color:var(--faint);margin:0 0 18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.75rem;color:var(--soft);margin-bottom:18px}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:middle;border:2px solid var(--accent);border-radius:6px}
.legend i.p{border-radius:2px;border-color:var(--ink)}.legend i.d{border-color:var(--gold);background:var(--goldbg);transform:skewX(-20deg);border-radius:0}
.flow{display:flex;flex-direction:column;align-items:center}
.node{width:100%;max-width:470px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:11px 14px;position:relative}
.node:hover,.node:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.node .n{position:absolute;left:-14px;top:-12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ink-on);font:700 .75rem ui-monospace,monospace;display:flex;align-items:center;justify-content:center}
.node b{font:700 .88rem ui-monospace,Menlo,Consolas,monospace;display:block;padding-right:18px}
.node span.d{display:block;font-size:.82rem;color:var(--soft);margin-top:2px}
.node.io{border-color:var(--accent);border-radius:999px;text-align:center;padding:11px 24px}
.node.io b{font-family:inherit}
.node.dec{border-color:var(--gold);background:var(--goldbg);max-width:420px}
.node::after{content:"+";position:absolute;right:11px;top:8px;color:var(--faint);font-weight:700}
.node[aria-expanded=true]::after{content:"–"}
.io-pane{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font:.78rem/1.55 ui-monospace,Menlo,Consolas,monospace}
.node[aria-expanded=true] .io-pane{display:block}
.io-pane em{font-style:normal;font-weight:700;margin-right:6px}
.io-pane .i{color:var(--accent)}.io-pane .o{color:var(--green)}
.arr{width:2px;height:22px;background:var(--faint);position:relative;margin:0 auto}
.arr::after{content:"";position:absolute;bottom:-1px;left:-5px;border:6px solid transparent;border-top:8px solid var(--faint);border-bottom:0}
.arr[data-l]::before{content:attr(data-l);position:absolute;left:10px;top:1px;font-size:.7rem;font-weight:700;color:var(--gold)}
.ex{margin-top:26px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ex h2{margin:0 0 8px;font-size:.78rem;letter-spacing:.06em;color:var(--faint)}
.ex table{width:100%;border-collapse:collapse;font:.8rem ui-monospace,Menlo,Consolas,monospace}
.ex td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}.ex td:first-child{color:var(--accent);white-space:nowrap;font-weight:700}
.out{margin-top:10px;font:700 1.1rem ui-monospace,Menlo,Consolas,monospace;color:var(--accent);word-break:break-word}
.hint{font-size:.78rem;color:var(--faint);margin:0 0 14px}
footer{text-align:center;font-size:.78rem;color:var(--faint);margin-top:22px}
</style>
</head>
<body>
<div class="page">
<header>
  <div><h1>Radix <small>Σ d·bⁱ</small></h1><p class="sub">Process flowcharts for the three core functions</p></div>
  <button class="tog" id="tog" type="button" aria-label="Toggle dark mode">☼</button>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="card" id="card"></div>
<footer>Abellanida · Bayani · Blanco · Cruz · Tolentino — TUPM-BSECE-3B</footer>
</div>
<script>
(function(){
var F=[
{tab:"Radix Converter",lead:"Converts a number, integer or fractional, from any base 2–36 to any other.",entry:"runConvert() → convertNumber(raw, srcBase, tgtBase)",
 nodes:[
 ["io","Input","Number, source base, target base","srcNumber, srcBase, tgtBase","text + 2 bases"],
 ["p","validateBase() ×2","Both bases must be whole numbers 2–36","srcBase, tgtBase fields","srcBase, tgtBase (Numbers)"],
 ["p","parseNumberForBase()","Strip sign, split at “.”, check every digit < base","raw text, srcBase","{ intDigits, fracDigits, negative }"],
 ["p","analyzeNumber()","Positional expansion: fraction digits ÷ base^len, merged with integer part","parsed, srcBase","{ unsignedNum, unsignedDen }"],
 ["p","reduceFrac()","Lowest terms via gcdBig","unsignedNum, unsignedDen","{ num, den }"],
 ["p","renderConversionTables()","Whole part → decimalToBaseSteps (÷ base, read remainders bottom-up). Fraction → fractionMulSteps (× base, max 10 digits)","reduced.num, reduced.den, tgtBase","{ digitsStr, step tables }"],
 ["d","Negative input?","Prefix “-” only if input was negative and non-zero","conv.digitsStr, parsed.negative","resultDigits"],
 ["io","Output","Result + step-by-step breakdown","res via buildConversionStepsList()","digits in target base"]],
 ex:[["parse","intDigits “255”, fracDigits “5”"],["analyze","fracNum 5, fracDen 10 → 2555/10"],["reduce","511/2"],["÷ 16","255→15 r15 →0 r15 ⇒ FF"],["× 16","1/2 × 16 = 8 r0 ⇒ .8"]],exT:"255.5 (base 10) → base 16",out:"FF.8 (base 16)"},
{tab:"Mixed Radix Operations",lead:"Adds, subtracts, multiplies or divides two numbers that may be in different bases.",entry:"runArith()",
 nodes:[
 ["io","Input","N1 + base, operator, N2 + base","n1, b1, operator, n2, b2","text, bases, op"],
 ["p","validateBase() ×2 → parseNumberForBase() ×2","Each operand is checked against its own base","fields","p1, p2 parsed"],
 ["d","Bases equal?","bTarget = max(b1, b2). If they differ, the lower-base operand is converted up to bTarget (display step). If equal, no normalization.","b1, b2","bTarget, lower"],
 ["p","analyzeNumber() ×2 → reduceFrac() ×2","Each operand becomes an exact signed rational, regardless of base","p1, b1, p2, b2","r1 {num,den}, r2 {num,den}"],
 ["d","÷ and r2 = 0?","If r2.num = 0n, stop: “Cannot divide by zero.” (also catches “.0”)","operator, r2","continue or Error"],
 ["p","Exact fraction arithmetic → reduceFrac()","+ / −: (a·d ± c·b)/(b·d)   ×: (a·c)/(b·d)   ÷: (a·d)/(b·c)","r1, r2, operator","resultRational {num, den}"],
 ["p","renderConversionTables()","Convert |result| into bTarget (÷ for whole part, × for fraction); prefix “-” if negative","|num|, den, bTarget","resultDigits + tables"],
 ["io","Output","Result in bTarget + decimal equivalent (rationalDisplay)","resultRational","digits + decimal value"]],
 ex:[["r1, r2","10/1 and 168/16 → 21/2"],["bTarget","max(2, 16) = 16; N1 is lower"],["normalize","N1 = A (base 16)"],["add","(10·2 + 21·1)/(1·2) = 41/2 = 20.5"],["convert","20 → 14, 1/2 → .8"]],exT:"1010 (base 2) + A.8 (base 16)",out:"14.8 (base 16) · decimal 20.5"},
{tab:"Complements",lead:"Finds the (r−1)'s and r's complements of a non-negative number in a fixed digit width.",entry:"runComplements() → computeComplements(intDigits, fracDigits, base, width)",
 nodes:[
 ["io","Input","Magnitude, base, optional integer width","complNumber, complBase, complWidth","text, base, width|null"],
 ["p","validateBase() → parseNumberForBase()","Validate base and digits","fields","{ intDigits, fracDigits, negative }"],
 ["d","Negative sign?","Rejected: complements apply to magnitudes only","parsed.negative","continue or Error"],
 ["d","Width ≥ integer digits?","If too small → error. Otherwise left-pad the integer part with zeros (fraction never padded)","intDigits, requestedWidth","paddedInt, nInt, fracLen"],
 ["p","Flatten digits","Join integer + fraction into one string; “.” isn't a digit, so set it aside","paddedInt, fracDigits","fullDigits"],
 ["p","(r−1)'s complement","Each digit d → (base − 1) − d. No borrowing","fullDigits, base","diminishedFlat, rows[]"],
 ["p","r's complement","Add 1 to the rightmost digit and ripple the carry left; a carry off the left end is dropped","diminishedFlat, base","radixFlat, carryRows[]"],
 ["p","withPoint()","Re-insert “.” after nInt digits","both flat strings, nInt","diminishedDigits, radixDigits"],
 ["io","Output","Two result cards + 3-step breakdown","res via buildComplementSteps()","(r−1)'s and r's complement"]],
 ex:[["pad","nInt 3, fracLen 2"],["flatten","24632"],["(r−1)","9−2, 9−4, 9−6, 9−3, 9−2 ⇒ 75367"],["+1","75367 + 1 ⇒ 75368"],["withPoint","753.67 and 753.68"]],exT:"246.32 (base 10)",out:"9's = 753.67 · 10's = 753.68"}
];
var tabs=document.getElementById('tabs'),card=document.getElementById('card'),cur=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(){
 var f=F[cur],h='<p class="lead">'+esc(f.lead)+'</p><p class="entry">'+esc(f.entry)+'</p>'+
 '<div class="legend"><span><i></i>Input / output</span><span><i class="p"></i>Process (function)</span><span><i class="d"></i>Decision / guard</span></div>'+
 '<p class="hint">Tap any box to see its input and output.</p><div class="flow">';
 f.nodes.forEach(function(n,i){
  var c=n[0]==="io"?"node io":n[0]==="d"?"node dec":"node";
  if(i)h+='<div class="arr"'+(n[0]==="d"?'':'')+'></div>';
  h+='<button type="button" class="'+c+'" aria-expanded="false">'+(n[0]==="io"?'':'<span class="n">'+i+'</span>')+'<b>'+esc(n[1])+'</b><span class="d">'+esc(n[2])+'</span><div class="io-pane"><div><em class="i">IN</em>'+esc(n[3])+'</div><div><em class="o">OUT</em>'+esc(n[4])+'</div></div></button>';
 });
 h+='</div><div class="ex"><h2>WORKED EXAMPLE — '+esc(f.exT.toUpperCase())+'</h2><table>'+f.ex.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'}).join('')+'</table><div class="out">= '+esc(f.out)+'</div></div>';
 card.innerHTML=h;
 card.querySelectorAll('.node').forEach(function(b){b.addEventListener('click',function(){b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')==='true'?'false':'true')})});
 tabs.querySelectorAll('.tab').forEach(function(t,i){t.setAttribute('aria-selected',String(i===cur))});
}
F.forEach(function(f,i){var b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.textContent=f.tab;b.addEventListener('click',function(){cur=i;draw()});tabs.appendChild(b)});
draw();
var root=document.documentElement,tg=document.getElementById('tog');
function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches}
function sync(){tg.textContent=dark()?'☾':'☼'}sync();
tg.addEventListener('click',function(){root.setAttribute('data-theme',dark()?'light':'dark');sync()});
})();
</script>
</body>
</html>
